<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 라이트박스 애니메이션 */
        #lightbox { transition: opacity 0.3s ease; }
        #lightbox.hidden { opacity: 0; pointer-events: none; }
        #lightbox.flex { opacity: 1; pointer-events: auto; }

        .flight-card {
            background-image: radial-gradient(circle at 0 50%, transparent 10px, #fff 11px),
                              radial-gradient(circle at 100% 50%, transparent 10px, #fff 11px);
            background-size: 50% 100%, 50% 100%;
            background-position: 0 0, 100% 0;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 pb-24">

                        <label class="cursor-pointer"><input type="radio" name="category" value="관광" class="peer sr-only" onchange="toggleFields()"><div class="text-center py-2 bg-stone-50 rounded-lg border-2 border-stone-100 peer-checked:bg-blue-50 peer-checked:text-blue-600 peer-checked:border-blue-500 text-xs font-bold transition">📷 관광</div></label>
                        <label class="cursor-pointer"><input type="radio" name="category" value="쇼핑" class="peer sr-only" onchange="toggleFields()"><div class="text-center py-2 bg-stone-50 rounded-lg border-2 border-stone-100 peer-checked:bg-yellow-50 peer-checked:text-yellow-600 peer-checked:border-yellow-500 text-xs font-bold transition">🛍️ 쇼핑</div></label>

                            <div>
                                <label class="block text-xs font-bold text-stone-500 mb-1">장소명</label>

                            </div>
                        </div>
                    </div>

                    <!-- 교통 전용 -->

                        </div>

                            <input type="text" name="price" id="input-price" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">

                        <div id="field-reserveLink"><input type="url" name="reserveLink" id="input-reserve" placeholder="예약 링크" class="w-full pl-3 bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500"></div>

            <button class="absolute top-4 right-4 text-white/70 hover:text-white text-3xl"><i class="fa-solid fa-xmark"></i></button>

    </main>

    <script>
        const STORAGE_KEY = 'osaka_planner_final_v14';
        let tripData = [];
        let currentFilter = 'all';
        let currentRegion = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderCards();
            toggleFields();
        });

        // --- Core Functions ---
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) tripData = JSON.parse(saved);
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
            renderCards();
        }

        function goHome() {
            switchMode('view');
            filterCategory('all');
            window.scrollTo(0,0);
        }

        // --- Upload / Edit Logic ---
        function initUploadMode() {
            resetForm();
            switchMode('upload');
        }

        function resetForm() {
            document.getElementById('trip-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = "정보 입력";
            document.getElementById('save-btn').innerHTML = '<i class="fa-solid fa-check"></i> 완료';
            document.getElementById('preview-img').classList.add('hidden');
            document.getElementById('final-img-data').value = '';
            document.getElementById('existing-img-data').value = '';
            
            // 카테고리 기본값(식당)으로 리셋 및 필드 토글
            document.querySelector('input[name="category"][value="식당"]').checked = true;
            toggleFields();
        }

        function editItem(id) {
            const item = tripData.find(i => i.id === id);
            if (!item) return;

            // 1. 폼 채우기
            document.getElementById('edit-id').value = item.id;
            document.querySelector(`input[name="category"][value="${item.category}"]`).checked = true;
            toggleFields();

            document.getElementById('input-region').value = item.region || '';
            document.getElementById('input-name').value = item.name || '';
            document.getElementById('input-origin').value = item.origin || '';
            document.getElementById('input-dest').value = item.destination || '';
            document.getElementById('input-desc').value = item.desc || '';
            document.getElementById('input-menu').value = item.menu || '';
            document.getElementById('input-price').value = item.price || '';
            document.getElementById('input-map').value = item.mapLink || '';
            document.getElementById('input-related').value = item.relatedLink || '';
            document.getElementById('input-reserve').value = item.reserveLink || '';

            // 이미지 처리
            if (item.imgData) {
                document.getElementById('preview-img').src = item.imgData;
                document.getElementById('preview-img').classList.remove('hidden');
                document.getElementById('existing-img-data').value = item.imgData; // 기존 이미지 보존
            } else {
                document.getElementById('preview-img').classList.add('hidden');
            }

            // 2. UI 변경
            document.getElementById('form-title').innerText = "내용 수정";
            document.getElementById('save-btn').innerHTML = '<i class="fa-solid fa-rotate"></i> 수정 완료';
            switchMode('upload');
        }

        function saveItem(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const editId = formData.get('id'); // 수정 모드일 때 ID
            
            // 이미지: 새로 올린 것 > URL 입력 > 기존 이미지 > 없음
            let finalImg = document.getElementById('final-img-data').value;
            if(!finalImg) finalImg = document.getElementById('imgUrlField').value;
            if(!finalImg) finalImg = document.getElementById('existing-img-data').value;

            const category = formData.get('category');
            
            const itemData = {
                id: editId ? parseInt(editId) : Date.now(),
                category: category,
                desc: formData.get('desc'),
                reserveLink: formData.get('reserveLink'),
                relatedLink: formData.get('relatedLink'),
                mapLink: category !== '교통' ? formData.get('mapLink') : null,
                imgData: finalImg,
                region: category !== '교통' ? formData.get('region') : null,
                name: category !== '교통' ? formData.get('placeName') : null,
                origin: category === '교통' ? formData.get('origin') : null,
                destination: category === '교통' ? formData.get('destination') : null,
                menu: category === '식당' ? formData.get('menu') : null,
                price: category === '식당' ? formData.get('price') : null,
            };

            if (editId) {
                // 수정: 기존 데이터에서 인덱스 찾아 교체
                const index = tripData.findIndex(i => i.id === parseInt(editId));
                if (index !== -1) tripData[index] = itemData;
                alert("수정되었습니다.");
            } else {
                // 신규 저장
                tripData.push(itemData);
                alert("저장되었습니다.");
            }

            saveData();
            switchMode('view');
        }

        function deleteItem(id) {
            if(confirm("삭제하시겠습니까?")) {
                tripData = tripData.filter(i => i.id !== id);
                saveData();
            }
        }

        function clearAllData() {
            if(confirm("정말 모든 데이터를 삭제하시겠습니까? 복구할 수 없습니다.")) {
                localStorage.removeItem(STORAGE_KEY);
                tripData = [];
                renderCards();
            }
        }

        // --- UI Logic ---
        function switchMode(mode) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(mode + '-mode').classList.add('active');
            
            const viewBtn = document.getElementById('btn-view');
            const uploadBtn = document.getElementById('btn-upload');

            if(mode === 'view') {
                viewBtn.className = "text-xs bg-rose-600 text-white px-3 py-2 rounded-lg font-bold shadow transition";
                uploadBtn.className = "text-xs bg-white text-stone-600 border border-stone-300 px-3 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50";
                renderCards(); // 뷰 모드 진입 시 리렌더링
            } else {
                uploadBtn.className = "text-xs bg-rose-600 text-white px-3 py-2 rounded-lg font-bold shadow transition";
                viewBtn.className = "text-xs bg-white text-stone-600 border border-stone-300 px-3 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50";
            }
        }

        function filterCategory(cat) {
            currentFilter = cat;
            currentRegion = 'all'; // 카테고리 바꾸면 지역 필터 초기화
            updateFilterButtons();
            renderCards();
        }

        function filterRegion(reg) {
            currentRegion = reg;
            renderCards();
            updateRegionButtons();
        }

        function updateFilterButtons() {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(currentFilter.replace('all','전체'))) {
                    btn.className = "cat-btn active bg-stone-800 text-white px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "cat-btn bg-white border border-stone-300 text-stone-600 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-sm";
                }
            });
        }

        function updateRegionButtons() {
            // 현재 지역 필터 버튼 스타일 업데이트
            document.querySelectorAll('.reg-btn').forEach(btn => {
                if (btn.innerText === currentRegion || (currentRegion === 'all' && btn.innerText === '전체')) {
                    btn.className = "reg-btn bg-stone-600 text-white px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "reg-btn bg-stone-200 text-stone-600 px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap shadow-sm";
                }
            });
        }

        function renderCards() {
            const container = document.getElementById('card-container');
            const emptyState = document.getElementById('empty-state');
            const flightInfo = document.getElementById('flight-info');
            const hotelInfo = document.getElementById('hotel-info');
            const regionFilterContainer = document.getElementById('region-filters');

            container.innerHTML = '';

            // 1. 기본 필터링 (카테고리)
            let filtered = tripData;
            if (currentFilter !== 'all') {
                filtered = tripData.filter(i => i.category === currentFilter);
            }

            // 2. 지역 필터 생성 (현재 필터된 데이터 기준 지역 목록 추출)
            const regions = [...new Set(filtered.map(i => i.region || i.origin).filter(Boolean))]; // 교통은 출발지를 지역으로 간주
            
            if (regions.length > 0) {
                let regionHtml = `<button onclick="filterRegion('all')" class="reg-btn ${currentRegion === 'all' ? 'bg-stone-600 text-white' : 'bg-stone-200 text-stone-600'} px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap shadow-sm">전체</button>`;
                regions.forEach(r => {
                    regionHtml += `<button onclick="filterRegion('${r}')" class="reg-btn ${currentRegion === r ? 'bg-stone-600 text-white' : 'bg-stone-200 text-stone-600'} px-3 py-1 rounded-full text-[10px] font-bold whitespace-nowrap shadow-sm">${r}</button>`;
                });
                regionFilterContainer.innerHTML = regionHtml;
                regionFilterContainer.classList.remove('hidden');
            } else {
                regionFilterContainer.innerHTML = '';
            }

            // 3. 2차 필터링 (지역)
            if (currentRegion !== 'all') {
                filtered = filtered.filter(i => (i.region === currentRegion || i.origin === currentRegion));
            }

            // 정렬
            filtered.sort((a, b) => b.id - a.id);

            // 4. UI 표시 제어 (전체보기 일때만 항공/숙소 보이기)
            if (currentFilter === 'all' && currentRegion === 'all') {
                flightInfo.classList.remove('hidden');
                hotelInfo.classList.remove('hidden');
            } else {
                flightInfo.classList.add('hidden');
                hotelInfo.classList.add('hidden');
            }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            // 5. 카드 렌더링
            filtered.forEach(item => {
                let badgeClass = 'bg-stone-100 text-stone-600';
                if(item.category === '식당') badgeClass = 'bg-rose-100 text-rose-600';
                else if(item.category === '관광') badgeClass = 'bg-blue-100 text-blue-600';
                else if(item.category === '쇼핑') badgeClass = 'bg-yellow-100 text-yellow-600';
                else if(item.category === '교통') badgeClass = 'bg-green-100 text-green-600';

                // 이미지 (3:4 비율)
                let imgHtml = item.imgData ? 
                    `<div class="aspect-[3/4] w-full bg-stone-200 overflow-hidden relative cursor-pointer" onclick="openLightbox('${item.imgData}')">
                        <img src="${item.imgData}" class="w-full h-full object-cover transition hover:scale-105 duration-500">
                    </div>` : 
                    `<div class="aspect-[3/4] w-full bg-stone-100 flex items-center justify-center text-stone-300 text-xs">NO IMAGE</div>`;

                // 내용
                let contentHtml = '';
                if(item.category === '교통') {
                    contentHtml = `<div class="bg-green-50 p-2 rounded border border-green-100 mb-2"><div class="font-bold text-green-700 text-sm truncate">${item.origin}</div><div class="text-center text-green-400 text-xs py-1"><i class="fa-solid fa-arrow-down"></i></div><div class="font-bold text-green-700 text-sm truncate">${item.destination}</div></div>`;
                } else {
                    // 지역 + 메뉴 뱃지
                    contentHtml = `
                    <div class="flex flex-wrap gap-1 mb-2">
                        ${item.region ? `<span class="bg-stone-100 text-stone-500 text-[10px] px-1.5 py-0.5 rounded font-bold truncate max-w-full">${item.region}</span>` : ''}
                        ${item.menu ? `<span class="bg-orange-50 text-orange-600 text-[10px] px-1.5 py-0.5 rounded font-bold truncate max-w-full">${item.menu}</span>` : ''}
                    </div>
                    <h3 class="text-base font-bold text-stone-800 leading-tight mb-1 truncate">${item.name}</h3>`;
                }

                // 버튼
                let mapBtn = (item.category !== '교통' && item.mapLink) ? `<a href="${item.mapLink}" target="_blank" class="flex-1 bg-white border border-stone-200 text-stone-500 py-2 rounded text-[10px] font-bold hover:bg-stone-50 text-center">지도</a>` : '';
                let relatedBtn = item.relatedLink ? `<a href="${item.relatedLink}" target="_blank" class="flex-1 bg-blue-50 border border-blue-100 text-blue-500 py-2 rounded text-[10px] font-bold hover:bg-blue-100 text-center">소개</a>` : '';
                let reserveBtn = (item.category !== '쇼핑' && item.reserveLink) ? `<a href="${item.reserveLink}" target="_blank" class="flex-1 bg-rose-50 border border-rose-100 text-rose-500 py-2 rounded text-[10px] font-bold hover:bg-rose-100 text-center">예약</a>` : '';

                // 버튼 그룹 (비어있으면 숨김)
                let btnsHtml = '';
                if(mapBtn || relatedBtn || reserveBtn) {
                    btnsHtml = `<div class="flex gap-1 mt-3 pt-3 border-t border-stone-100">${mapBtn}${relatedBtn}${reserveBtn}</div>`;
                }

                container.innerHTML += `
                <div class="bg-white rounded-xl shadow-sm border border-stone-100 overflow-hidden group relative flex flex-col">
                    <div class="absolute top-2 right-2 flex gap-1 z-10 opacity-0 group-hover:opacity-100 transition duration-200">
                        <button onclick="editItem(${item.id})" class="w-7 h-7 bg-white/90 hover:bg-blue-500 hover:text-white text-stone-500 rounded-full flex items-center justify-center shadow-sm text-xs"><i class="fa-solid fa-pencil"></i></button>
                        <button onclick="deleteItem(${item.id})" class="w-7 h-7 bg-white/90 hover:bg-red-500 hover:text-white text-stone-500 rounded-full flex items-center justify-center shadow-sm text-xs"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    ${imgHtml}
                    <div class="p-3 flex-1 flex flex-col">
                        <div class="mb-1"><span class="text-[10px] font-bold ${badgeClass} px-1.5 py-0.5 rounded">${item.category}</span></div>
                        <div class="flex-1">
                            ${contentHtml}
                            <p class="text-xs text-stone-400 line-clamp-2 mt-1">${item.desc || ''}</p>
                        </div>
                        ${btnsHtml}
                    </div>
                </div>`;
            });
        }

        // --- Lightbox ---
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }

        // --- Form Interaction (Toggle Fields) ---
        function toggleFields() {
            const category = document.querySelector('input[name="category"]:checked').value;
            const groupStandard = document.getElementById('group-standard'); 
            const groupTransport = document.getElementById('group-transport');
            const groupFood = document.getElementById('group-food');
            const fieldMap = document.getElementById('field-mapLink'); 
            const fieldReserve = document.getElementById('field-reserveLink');

            groupStandard.style.display = 'block';
            groupTransport.style.display = 'none';
            groupFood.style.display = 'none';
            fieldMap.style.display = 'block';
            fieldReserve.style.display = 'block';

            if (category === '교통') {
                groupStandard.style.display = 'none';
                groupTransport.style.display = 'block';
                fieldMap.style.display = 'none'; 
            } else if (category === '식당') {
                groupFood.style.display = 'grid';
            } else if (category === '쇼핑') {
                fieldReserve.style.display = 'none'; 
            }
        }

        // --- Image Helpers (Same as before) ---
        function switchImgMode(mode) {
            const urlInput = document.getElementById('img-url-input');
            const fileInput = document.getElementById('img-file-input');
            const btnUrl = document.getElementById('btn-img-url');
            const btnFile = document.getElementById('btn-img-file');
            if(mode === 'url') {
                urlInput.classList.remove('hidden'); fileInput.classList.add('hidden');
                btnUrl.className = "text-[10px] px-3 py-1 bg-stone-800 text-white rounded-full";
                btnFile.className = "text-[10px] px-3 py-1 bg-stone-200 text-stone-600 rounded-full";
            } else {
                urlInput.classList.add('hidden'); fileInput.classList.remove('hidden');
                btnFile.className = "text-[10px] px-3 py-1 bg-stone-800 text-white rounded-full";
                btnUrl.className = "text-[10px] px-3 py-1 bg-stone-200 text-stone-600 rounded-full";
            }
        }
        function previewImage(url) {
            const preview = document.getElementById('preview-img');
            if(url) { preview.src = url; preview.classList.remove('hidden'); preview.nextElementSibling.classList.add('hidden'); }
        }
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    const preview = document.getElementById('preview-img');
                    preview.src = dataUrl;
                    preview.classList.remove('hidden');
                    preview.nextElementSibling.classList.add('hidden');
                    document.getElementById('final-img-data').value = dataUrl;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>

    <!-- 라이트박스 컨테이너 -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <img id="lightbox-img" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl" src="">
    </div>

</body>
</html>
