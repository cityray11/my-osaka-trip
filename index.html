<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 오사카/교토 여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* 보딩패스 배경 패턴 */
        .flight-card {
            background-image: radial-gradient(circle at 0 50%, transparent 10px, #ffffff 11px),
                              radial-gradient(circle at 100% 50%, transparent 10px, #ffffff 11px);
            background-size: 50% 100%, 50% 100%;
            background-position: 0 0, 100% 0;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 pb-24">

    <!-- 지역 자동완성 리스트 -->
    <datalist id="location-list">
        <option value="오사카 우메다">
        <option value="오사카 난바/도톤보리">
        <option value="오사카 신사이바시">
        <option value="오사카성 공원">
        <option value="유니버셜 스튜디오 (USJ)">
        <option value="교토 아라시야마">
        <option value="교토 가와라마치">
        <option value="교토 청수사 (기요미즈데라)">
        <option value="교토 기온 거리">
        <option value="교토 후시미 이나리">
        <option value="간사이 공항 (KIX)">
        <option value="고베 산노미야">
        <option value="나라 사슴공원">
    </datalist>

    <!-- 상단 헤더 -->
    <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-stone-200">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-rose-600 flex items-center gap-2 cursor-pointer hover:opacity-80 transition" onclick="goHome()">
                <i class="fa-solid fa-map"></i> Osaka
            </h1>
            <div class="flex gap-2">
                <!-- 비용 버튼: 구글 시트 연결 -->
                <a href="https://docs.google.com/spreadsheets/d/14w6schJSDujTsJbb6BhCdYpbiOjt49kw8gntE3wiIuk/edit?usp=sharing" target="_blank" class="text-xs bg-white text-stone-600 border border-stone-300 px-4 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50 flex items-center gap-1">
                    <i class="fa-solid fa-won-sign"></i> 비용
                </a>
                <button onclick="switchMode('view')" id="btn-view" class="text-xs bg-rose-600 text-white px-4 py-2 rounded-lg font-bold shadow transition">
                    <i class="fa-solid fa-list"></i> 일정
                </button>
                <button onclick="switchMode('upload')" id="btn-upload" class="text-xs bg-white text-stone-600 border border-stone-300 px-4 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50">
                    <i class="fa-solid fa-plus"></i> 등록
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- [VIEW MODE] 일정 및 정보 보기 -->
        <div id="view-mode" class="tab-content active">
            
            <!-- 1. 항공권 정보 (수정됨) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                <!-- 가는 편 -->
                <div class="flight-card bg-white p-4 rounded-xl shadow-sm border border-stone-100 flex flex-col justify-between h-32 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
                    <div class="flex justify-between items-center text-xs text-stone-400 mb-1 pl-2">
                        <span class="font-bold text-blue-600"><i class="fa-solid fa-plane-departure"></i> 가는 편</span>
                        <span>3.29 (일)</span>
                    </div>
                    <div class="flex justify-between items-center pl-2">
                        <div class="text-center">
                            <span class="block text-2xl font-black text-stone-800">CJJ</span>
                            <span class="text-xs text-stone-500">청주</span>
                        </div>
                        <div class="flex-1 px-4 text-center">
                            <div class="text-[10px] text-stone-400">1h 45m</div>
                            <div class="w-full h-[1px] bg-stone-300 relative my-1">
                                <i class="fa-solid fa-plane absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-stone-300 text-xs"></i>
                            </div>
                            <div class="text-[10px] text-stone-400">직항</div>
                        </div>
                        <div class="text-center">
                            <span class="block text-2xl font-black text-stone-800">KIX</span>
                            <span class="text-xs text-stone-500">오사카</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-end mt-2 pl-2">
                        <div class="text-xl font-bold text-blue-600">15:50</div>
                        <div class="text-xl font-bold text-stone-400">~ 17:35</div>
                    </div>
                </div>

                <!-- 오는 편 -->
                <div class="flight-card bg-white p-4 rounded-xl shadow-sm border border-stone-100 flex flex-col justify-between h-32 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-rose-500"></div>
                    <div class="flex justify-between items-center text-xs text-stone-400 mb-1 pl-2">
                        <span class="font-bold text-rose-600"><i class="fa-solid fa-plane-arrival"></i> 오는 편</span>
                        <span>3.31 (화)</span>
                    </div>
                    <div class="flex justify-between items-center pl-2">
                        <div class="text-center">
                            <span class="block text-2xl font-black text-stone-800">KIX</span>
                            <span class="text-xs text-stone-500">오사카</span>
                        </div>
                        <div class="flex-1 px-4 text-center">
                            <div class="text-[10px] text-stone-400">2h 05m</div>
                            <div class="w-full h-[1px] bg-stone-300 relative my-1">
                                <i class="fa-solid fa-plane absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-stone-300 text-xs rotate-180"></i>
                            </div>
                            <div class="text-[10px] text-stone-400">직항</div>
                        </div>
                        <div class="text-center">
                            <span class="block text-2xl font-black text-stone-800">ICN</span>
                            <span class="text-xs text-stone-500">인천</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-end mt-2 pl-2">
                        <div class="text-xl font-bold text-rose-600">22:00</div>
                        <div class="text-xl font-bold text-stone-400">~ 00:05 <span class="text-xs align-top">+1</span></div>
                    </div>
                </div>
            </div>

            <!-- 2. 숙소 정보 (호텔 엘세레이네) -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6 border border-stone-100 flex flex-row h-auto relative">
                <!-- 이미지 영역 -->
                <div class="w-1/3 md:w-40 relative bg-stone-200 group min-h-[160px]">
                    <!-- 같은 폴더의 hotel_main.jpg를 불러옴. 없으면 플레이스홀더 -->
                    <img src="./hotel_main.jpg" onerror="this.src='https://placehold.co/400x600?text=Hotel+Image'" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute top-0 left-0 bg-purple-600 text-white text-[10px] font-bold px-2 py-1 rounded-br-lg shadow-sm z-10">
                        Base Camp
                    </div>
                </div>
                
                <!-- 정보 영역 -->
                <div class="flex-1 p-4 flex flex-col justify-between">
                    <div>
                        <h2 class="font-bold text-lg leading-tight text-stone-800">호텔 엘세레이네 오사카</h2>
                        <p class="text-[10px] text-stone-400 font-medium mb-3 uppercase tracking-wide">Hotel Elsereine Osaka</p>
                        
                        <div class="flex flex-wrap gap-2 text-xs text-stone-600">
                            <div class="flex items-center gap-1 bg-stone-50 px-2 py-1 rounded border border-stone-100">
                                <i class="fa-regular fa-calendar text-purple-400"></i>
                                <span class="font-bold">3.29(일) - 3.31(화)</span>
                            </div>
                            <div class="flex items-center gap-2 bg-stone-50 px-2 py-1 rounded border border-stone-100">
                                <span>IN 15:00</span>
                                <span class="text-stone-300">|</span>
                                <span>OUT 11:00</span>
                            </div>
                        </div>
                    </div>

                    <!-- 버튼 영역 -->
                    <div class="mt-4 flex justify-end gap-2">
                        <a href="https://www.google.com/travel/search?ts=CAESCgoCCAMKAggDEAAaYwpFEkMyJTB4NjAwMGU2ZjI2YjA1YzA4OToweGJhNTQ5OTUyOWQ4MTY1YWI6Gu2YuO2FlCDsl5jshLjrnoAg7Jik7IKs7Lm0EhoSFAoHCOoPEAEYDBIHCOoPEAEYDRgBMgIQACoHCgU6A0tSVw&qs=CAEyKENob0lxOHVGN0ttcXBxcTZBUm9OTDJjdk1URmlObk51ZG1oaVl4QUI4AkIJCatlgZ1SmVS6QgkJq2WBnVKZVLo&utm_campaign=sharing&utm_medium=link_btn&utm_source=htls" target="_blank" class="bg-white border border-stone-300 text-stone-600 px-3 py-2 rounded-lg text-xs font-bold hover:bg-stone-50 transition shadow-sm flex items-center">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> 지도
                        </a>
                        <a href="https://www.klook.com/ko/hotels/detail/51487-hotel-elsereine-osaka/?spm=SearchResult.SearchResult_LIST&clickId=6463bcbe48&room_num=1&adult_num=3&child_num=0&age=&check_in=2026-03-29&check_out=2026-03-31&latlng=" target="_blank" class="bg-purple-500 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-purple-600 transition shadow-sm flex items-center">
                            <i class="fa-solid fa-check-to-slot mr-1"></i> 예약
                        </a>
                    </div>
                </div>
            </div>

            <!-- 3. 카테고리 필터 -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-hide sticky top-[60px] z-40 bg-stone-100 py-2">
                <button onclick="filterData('all')" class="filter-btn active bg-stone-800 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm">전체</button>
                <button onclick="filterData('식당')" class="filter-btn bg-white border border-stone-300 text-stone-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm">🍱 식당</button>
                <button onclick="filterData('관광')" class="filter-btn bg-white border border-stone-300 text-stone-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm">📷 관광</button>
                <button onclick="filterData('쇼핑')" class="filter-btn bg-white border border-stone-300 text-stone-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm">🛍️ 쇼핑</button>
                <button onclick="filterData('교통')" class="filter-btn bg-white border border-stone-300 text-stone-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm">🚌 교통</button>
            </div>

            <!-- 4. 데이터 없을 때 -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <div class="w-16 h-16 bg-stone-200 rounded-full flex items-center justify-center text-3xl mb-4 text-stone-400">📝</div>
                <h3 class="text-lg font-bold text-stone-600">일정을 채워주세요</h3>
                <p class="text-sm text-stone-400 mt-2">상단 '등록' 버튼을 눌러<br>나만의 여행 지도를 완성하세요.</p>
            </div>

            <!-- 5. 카드 리스트 컨테이너 -->
            <div id="card-container" class="space-y-6">
                <!-- JS로 카드가 여기에 생성됩니다 -->
            </div>

            <!-- 6. 초기화 버튼 -->
            <div class="mt-12 text-center pb-10">
                <button onclick="clearAllData()" class="text-xs text-stone-400 underline hover:text-red-500">모든 데이터 삭제하기</button>
            </div>
        </div>

        <!-- [UPLOAD MODE] 입력 폼 -->
        <div id="upload-mode" class="tab-content">
            <div class="bg-white rounded-2xl shadow-lg border border-stone-100 p-6">
                <h2 class="text-xl font-bold mb-6 text-stone-800 flex items-center gap-2">
                    <span class="w-1 h-6 bg-rose-500 rounded-full block"></span>
                    정보 입력
                </h2>
                
                <form id="trip-form" onsubmit="saveItem(event)" class="space-y-6">
                    
                    <!-- 카테고리 -->
                    <div>
                        <label class="block text-xs font-bold text-stone-500 mb-2">카테고리</label>
                        <div class="grid grid-cols-4 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="식당" class="peer sr-only" checked onchange="toggleFields()">
                                <div class="text-center py-3 bg-stone-50 rounded-xl border-2 border-stone-100 peer-checked:bg-rose-50 peer-checked:text-rose-600 peer-checked:border-rose-500 text-xs font-bold transition">
                                    <div class="text-lg mb-1">🍱</div>식당
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="관광" class="peer sr-only" onchange="toggleFields()">
                                <div class="text-center py-3 bg-stone-50 rounded-xl border-2 border-stone-100 peer-checked:bg-blue-50 peer-checked:text-blue-600 peer-checked:border-blue-500 text-xs font-bold transition">
                                    <div class="text-lg mb-1">📷</div>관광
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="쇼핑" class="peer sr-only" onchange="toggleFields()">
                                <div class="text-center py-3 bg-stone-50 rounded-xl border-2 border-stone-100 peer-checked:bg-yellow-50 peer-checked:text-yellow-600 peer-checked:border-yellow-500 text-xs font-bold transition">
                                    <div class="text-lg mb-1">🛍️</div>쇼핑
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="교통" class="peer sr-only" onchange="toggleFields()">
                                <div class="text-center py-3 bg-stone-50 rounded-xl border-2 border-stone-100 peer-checked:bg-green-50 peer-checked:text-green-600 peer-checked:border-green-500 text-xs font-bold transition">
                                    <div class="text-lg mb-1">🚌</div>교통
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- [일반] 지역/이름 -->
                    <div id="group-standard">
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-stone-500 mb-1">지역 (자동완성)</label>
                                <input type="text" list="location-list" name="region" placeholder="지역 입력" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-stone-500 mb-1">장소/가게 이름</label>
                                <input type="text" name="placeName" placeholder="이름 입력" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 font-bold">
                            </div>
                        </div>
                    </div>

                    <!-- [교통] 출발/도착 -->
                    <div id="group-transport" class="hidden p-4 bg-green-50 rounded-xl border border-green-100">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-green-700 mb-1">출발지</label>
                                <input type="text" list="location-list" name="origin" placeholder="어디서" class="w-full bg-white border border-green-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div class="pt-5 text-green-400"><i class="fa-solid fa-arrow-right"></i></div>
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-green-700 mb-1">도착지</label>
                                <input type="text" list="location-list" name="destination" placeholder="어디로" class="w-full bg-white border border-green-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                        </div>
                    </div>

                    <!-- 공통 설명 -->
                    <div>
                        <label class="block text-xs font-bold text-stone-500 mb-1">설명 / 메모</label>
                        <textarea name="desc" rows="3" placeholder="영업시간, 팁, 구매리스트 등" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"></textarea>
                    </div>

                    <!-- [식당] 메뉴/가격 -->
                    <div id="group-food" class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-stone-500 mb-1">대표 메뉴</label>
                            <input type="text" name="menu" placeholder="예: 스시 오마카세" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-stone-500 mb-1">가격대 (1인)</label>
                            <input type="text" name="price" placeholder="예: 5000엔~" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                        </div>
                    </div>

                    <!-- 링크 (구글맵/예약) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div id="field-mapLink">
                            <label class="block text-xs font-bold text-stone-500 mb-1">구글맵 링크</label>
                            <div class="relative">
                                <i class="fa-solid fa-map-location-dot absolute left-3 top-3.5 text-stone-400"></i>
                                <input type="url" name="mapLink" placeholder="https://goo.gl/maps/..." class="w-full pl-9 bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>
                        </div>
                        <div id="field-reserveLink">
                            <label class="block text-xs font-bold text-stone-500 mb-1">예약/정보 링크</label>
                            <div class="relative">
                                <i class="fa-solid fa-calendar-check absolute left-3 top-3.5 text-stone-400"></i>
                                <input type="url" name="reserveLink" placeholder="공홈, 타베로그 등" class="w-full pl-9 bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>
                        </div>
                    </div>

                    <!-- 이미지 업로드 -->
                    <div class="border-t border-stone-100 pt-4">
                        <label class="block text-xs font-bold text-stone-500 mb-2">대표 사진 (선택)</label>
                        <div class="flex gap-2 mb-2">
                            <button type="button" onclick="switchImgMode('url')" id="btn-img-url" class="text-[10px] px-3 py-1 bg-stone-800 text-white rounded-full">주소 입력</button>
                            <button type="button" onclick="switchImgMode('file')" id="btn-img-file" class="text-[10px] px-3 py-1 bg-stone-200 text-stone-600 rounded-full">파일 업로드</button>
                        </div>

                        <!-- URL 입력 -->
                        <div id="img-url-input">
                            <input type="url" id="imgUrlField" placeholder="이미지 주소 붙여넣기" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500" onchange="previewImage(this.value)">
                        </div>
                        <!-- 파일 업로드 -->
                        <div id="img-file-input" class="hidden">
                            <input type="file" id="imgFileField" accept="image/*" class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100" onchange="handleFileSelect(event)">
                        </div>

                        <!-- 미리보기 -->
                        <div class="mt-3 h-32 rounded-lg flex items-center justify-center border border-dashed border-stone-300 overflow-hidden relative bg-stone-50">
                            <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden">
                            <span class="text-xs text-stone-400">미리보기</span>
                        </div>
                        <input type="hidden" name="finalImgData" id="final-img-data">
                    </div>

                    <button type="submit" class="w-full bg-stone-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-stone-900 transition flex justify-center items-center gap-2 mt-4">
                        <i class="fa-solid fa-floppy-disk"></i> 저장하기
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script>
        const STORAGE_KEY = 'my_osaka_trip_data_final';
        let tripData = [];

        // 1. 초기화
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderCards('all');
            toggleFields();
        });

        // 2. 홈 버튼 (새로고침 효과)
        function goHome() {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('view-mode').classList.add('active');
            
            const viewBtn = document.getElementById('btn-view');
            const uploadBtn = document.getElementById('btn-upload');
            viewBtn.className = "text-xs bg-rose-600 text-white px-4 py-2 rounded-lg font-bold shadow transition";
            uploadBtn.className = "text-xs bg-white text-stone-600 border border-stone-300 px-4 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50";

            filterData('all');
            window.scrollTo(0,0);
        }

        // 3. 데이터 로드/저장/삭제
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) tripData = JSON.parse(saved);
        }

        function saveItem(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const category = formData.get('category');
            
            // 이미지 데이터 우선순위: 파일업로드(Base64) > URL입력
            let finalImg = document.getElementById('final-img-data').value;
            if(!finalImg && document.getElementById('imgUrlField').value) {
                finalImg = document.getElementById('imgUrlField').value;
            }

            const newItem = {
                id: Date.now(),
                category: category,
                desc: formData.get('desc'),
                reserveLink: formData.get('reserveLink'),
                imgData: finalImg,
                // 카테고리별 데이터
                region: category !== '교통' ? formData.get('region') : null,
                name: category !== '교통' ? formData.get('placeName') : null,
                menu: category === '식당' ? formData.get('menu') : null,
                price: category === '식당' ? formData.get('price') : null,
                mapLink: category !== '교통' ? formData.get('mapLink') : null,
                origin: category === '교통' ? formData.get('origin') : null,
                destination: category === '교통' ? formData.get('destination') : null
            };

            tripData.push(newItem);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
            
            alert('✅ 저장되었습니다!');
            e.target.reset();
            resetImagePreview();
            switchMode('view');
        }

        function deleteItem(id) {
            if(confirm("정말 삭제하시겠습니까?")) {
                tripData = tripData.filter(item => item.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
                
                // 현재 보고 있는 필터 유지하며 렌더링
                const activeBtn = document.querySelector('.filter-btn.active');
                const currentFilter = activeBtn ? activeBtn.innerText.replace(/[^가-힣\/]/g, '') : 'all';
                renderCards(activeBtn.innerText.includes('전체') ? 'all' : currentFilter);
            }
        }

        function clearAllData() {
            if(confirm("모든 데이터를 영구 삭제합니다. 계속하시겠습니까?")) {
                localStorage.removeItem(STORAGE_KEY);
                tripData = [];
                renderCards('all');
            }
        }

        // 4. UI 렌더링
        function renderCards(filterCategory) {
            const container = document.getElementById('card-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            // 필터링
            let filtered = tripData;
            if (filterCategory !== 'all') {
                filtered = tripData.filter(item => item.category === filterCategory);
            }

            // 최신순 정렬
            filtered.sort((a, b) => b.id - a.id);

            // 빈 상태 처리
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            filtered.forEach(item => {
                // 스타일
                let badgeClass = 'bg-stone-100 text-stone-600';
                if(item.category === '식당') badgeClass = 'bg-rose-100 text-rose-600';
                else if(item.category === '관광') badgeClass = 'bg-blue-100 text-blue-600';
                else if(item.category === '쇼핑') badgeClass = 'bg-yellow-100 text-yellow-600';
                else if(item.category === '교통') badgeClass = 'bg-green-100 text-green-600';

                // 이미지 HTML
                let imgHtml = '';
                if(item.imgData) {
                    imgHtml = `<div class="h-40 w-full bg-stone-200 overflow-hidden relative">
                        <img src="${item.imgData}" class="w-full h-full object-cover">
                        ${item.region ? `<div class="absolute top-2 left-2 px-2 py-1 rounded bg-black/60 text-white text-[10px] font-bold backdrop-blur-sm">${item.region}</div>` : ''}
                    </div>`;
                } else {
                     imgHtml = `<div class="h-20 bg-stone-50 flex items-center justify-center text-stone-300 text-xs">NO IMAGE</div>`;
                }

                // 타이틀 HTML
                let titleHtml = '';
                if(item.category === '교통') {
                    titleHtml = `
                    <div class="flex items-center gap-2 mb-2 bg-green-50 p-3 rounded-lg border border-green-100">
                        <span class="font-bold text-green-700">${item.origin || '?'}</span>
                        <i class="fa-solid fa-arrow-right text-green-400 text-xs"></i>
                        <span class="font-bold text-green-700">${item.destination || '?'}</span>
                    </div>`;
                } else {
                    titleHtml = `<h3 class="text-xl font-bold text-stone-800 leading-tight mb-1">📍 ${item.name}</h3>`;
                }

                // 식당 상세 HTML
                let menuHtml = '';
                if(item.category === '식당' && (item.menu || item.price)) {
                    menuHtml = `
                    <div class="mt-3 bg-stone-50 p-2.5 rounded-lg border border-stone-100 text-xs flex flex-col gap-1">
                        ${item.menu ? `<div class="flex justify-between"><span class="text-stone-400 font-bold">Menu</span> <span class="text-stone-700 font-bold">${item.menu}</span></div>` : ''}
                        ${item.price ? `<div class="flex justify-between"><span class="text-stone-400 font-bold">Price</span> <span class="text-stone-700 font-bold">${item.price}</span></div>` : ''}
                    </div>`;
                }

                // 버튼 HTML
                let mapBtn = '';
                if(item.category !== '교통') {
                    if(item.mapLink) {
                        mapBtn = `<a href="${item.mapLink}" target="_blank" class="flex-1 bg-white border border-stone-200 text-stone-600 py-2.5 rounded-lg text-center text-xs font-bold hover:bg-stone-50 transition"><i class="fa-solid fa-map-location-dot"></i> 지도</a>`;
                    } else {
                        mapBtn = `<button disabled class="flex-1 bg-stone-50 text-stone-300 border border-stone-100 py-2.5 rounded-lg text-center text-xs font-bold cursor-not-allowed">지도X</button>`;
                    }
                }

                let reserveBtn = '';
                if(item.category !== '쇼핑') {
                    if(item.reserveLink) {
                        reserveBtn = `<a href="${item.reserveLink}" target="_blank" class="flex-1 bg-rose-500 text-white py-2.5 rounded-lg text-center text-xs font-bold hover:bg-rose-600 transition shadow-sm"><i class="fa-solid fa-calendar-check"></i> 예약/정보</a>`;
                    } else {
                        reserveBtn = `<button disabled class="flex-1 bg-stone-50 text-stone-300 border border-stone-100 py-2.5 rounded-lg text-center text-xs font-bold cursor-not-allowed">예약X</button>`;
                    }
                }

                // 카드 생성
                const cardHtml = `
                <div class="bg-white rounded-xl shadow-sm border border-stone-100 overflow-hidden group hover:shadow-md transition">
                    <div class="relative">
                        ${imgHtml}
                        <button onclick="deleteItem(${item.id})" class="absolute top-2 right-2 w-8 h-8 bg-black/50 hover:bg-red-500 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-200 z-10">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                    
                    <div class="p-5">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold ${badgeClass}">${item.category}</span>
                        </div>
                        
                        ${titleHtml}
                        <p class="text-sm text-stone-500 whitespace-pre-wrap leading-relaxed">${item.desc}</p>
                        
                        ${menuHtml}

                        <div class="flex gap-2 mt-4 pt-4 border-t border-stone-100">
                            ${mapBtn}
                            ${reserveBtn}
                        </div>
                    </div>
                </div>`;
                
                container.innerHTML += cardHtml;
            });
        }

        // 5. 탭 및 필터 제어
        function switchMode(mode) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(mode + '-mode').classList.add('active');
            
            const viewBtn = document.getElementById('btn-view');
            const uploadBtn = document.getElementById('btn-upload');

            if(mode === 'view') {
                viewBtn.className = "text-xs bg-rose-600 text-white px-4 py-2 rounded-lg font-bold shadow transition";
                uploadBtn.className = "text-xs bg-white text-stone-600 border border-stone-300 px-4 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50";
                renderCards('all');
            } else {
                uploadBtn.className = "text-xs bg-rose-600 text-white px-4 py-2 rounded-lg font-bold shadow transition";
                viewBtn.className = "text-xs bg-white text-stone-600 border border-stone-300 px-4 py-2 rounded-lg font-bold shadow-sm transition hover:bg-stone-50";
            }
        }

        function filterData(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white border border-stone-300 text-stone-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm";
            });
            event.target.className = "filter-btn active bg-stone-800 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm";
            const cleanCat = category.replace(/[^가-힣\/]/g, '');
            renderCards(category === 'all' ? 'all' : cleanCat);
        }

        function toggleFields() {
            const category = document.querySelector('input[name="category"]:checked').value;
            const groupStandard = document.getElementById('group-standard'); 
            const groupTransport = document.getElementById('group-transport');
            const groupFood = document.getElementById('group-food');
            const fieldMap = document.getElementById('field-mapLink'); 
            const fieldReserve = document.getElementById('field-reserveLink');

            // Reset
            groupStandard.style.display = 'block';
            groupTransport.style.display = 'none';
            groupFood.style.display = 'none';
            fieldMap.style.display = 'block';
            fieldReserve.style.display = 'block';

            if (category === '교통') {
                groupStandard.style.display = 'none';
                groupTransport.style.display = 'block';
                fieldMap.style.display = 'none'; 
            } else if (category === '식당') {
                groupFood.style.display = 'grid';
            } else if (category === '쇼핑') {
                fieldReserve.style.display = 'none'; 
            }
        }

        function switchImgMode(mode) {
            const urlInput = document.getElementById('img-url-input');
            const fileInput = document.getElementById('img-file-input');
            const btnUrl = document.getElementById('btn-img-url');
            const btnFile = document.getElementById('btn-img-file');

            if(mode === 'url') {
                urlInput.classList.remove('hidden');
                fileInput.classList.add('hidden');
                btnUrl.className = "text-[10px] px-3 py-1 bg-stone-800 text-white rounded-full transition";
                btnFile.className = "text-[10px] px-3 py-1 bg-stone-200 text-stone-600 rounded-full transition";
            } else {
                urlInput.classList.add('hidden');
                fileInput.classList.remove('hidden');
                btnFile.className = "text-[10px] px-3 py-1 bg-stone-800 text-white rounded-full transition";
                btnUrl.className = "text-[10px] px-3 py-1 bg-stone-200 text-stone-600 rounded-full transition";
            }
        }

        function previewImage(url) {
            const preview = document.getElementById('preview-img');
            const span = preview.nextElementSibling;
            if(url) {
                preview.src = url;
                preview.classList.remove('hidden');
                span.classList.add('hidden');
            } else {
                resetImagePreview();
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    const preview = document.getElementById('preview-img');
                    preview.src = dataUrl;
                    preview.classList.remove('hidden');
                    document.getElementById('final-img-data').value = dataUrl;
                    preview.nextElementSibling.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        function resetImagePreview() {
            const preview = document.getElementById('preview-img');
            preview.classList.add('hidden');
            preview.src = '';
            preview.nextElementSibling.classList.remove('hidden');
            document.getElementById('final-img-data').value = "";
        }
    </script>
</body>
</html>
